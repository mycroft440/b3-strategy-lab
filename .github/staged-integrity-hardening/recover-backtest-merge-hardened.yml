name: Recover backtest merge — hardened

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run ID que contém os shards a recuperar
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: backtest-results-publication
  cancel-in-progress: false

env:
  TOP_N: "10"

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar ferramentas de merge/auditoria
        run: |
          python -m py_compile \
            scripts/merge_matrix_shards.py \
            scripts/audit_matrix_results.py \
            scripts/audit_backtest_readiness.py

      - name: Baixar shards do run informado
        uses: actions/download-artifact@v4
        with:
          pattern: matrix-shard-*
          path: reports/shards
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Validar conjunto de shards
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          csvs = sorted(Path("reports/shards").glob("shard_*.csv.gz"))
          manifests = sorted(Path("reports/shards").glob("shard_*.manifest.json"))
          annual = sorted(Path("reports/shards").glob("shard_*_top10_annual.md"))
          if not csvs or len(csvs) != len(manifests) or len(csvs) != len(annual):
              raise SystemExit(
                  f"shards incompletos: csv={len(csvs)} manifests={len(manifests)} annual={len(annual)}"
              )
          source_commits = {
              json.loads(path.read_text(encoding="utf-8")).get("git_commit")
              for path in manifests
          }
          if len(source_commits) != 1 or None in source_commits:
              raise SystemExit(f"proveniência inconsistente entre shards: {source_commits}")
          calculation_sha = str(next(iter(source_commits)))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"CALCULATION_SHA={calculation_sha}\n")
          print(f"shards={len(csvs)} calculation_sha={calculation_sha}")
          PY

      - name: Fixar ambiente no commit original dos shards
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/recovery-source"
          rm -rf "$SOURCE_DIR"
          git cat-file -e "${CALCULATION_SHA}^{commit}"
          git worktree add --detach "$SOURCE_DIR" "$CALCULATION_SHA"
          mkdir -p "$SOURCE_DIR/reports/shards"
          cp -a reports/shards/. "$SOURCE_DIR/reports/shards/"
          (
            cd "$SOURCE_DIR"
            python -m py_compile \
              scripts/merge_matrix_shards.py \
              scripts/audit_matrix_results.py \
              scripts/audit_backtest_readiness.py
          )
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Consolidar
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          python scripts/merge_matrix_shards.py \
            --input-dir reports/shards \
            --top "$TOP_N" \
            --output reports/strategy_management_combinations_40_adjusted_no_dividends_1d.csv.gz \
            --summary-output reports/TOP_10.md \
            --json-output reports/TOP_10.json

      - name: Auditar
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          python scripts/audit_matrix_results.py \
            --results reports/strategy_management_combinations_40_adjusted_no_dividends_1d.csv.gz \
            --annual-report reports/strategy_management_combinations_40_adjusted_no_dividends_1d_top10_annual.md \
            --output reports/strategy_management_combinations_40_adjusted_no_dividends_1d.audit.json
          MATRIX_END="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path("reports/strategy_management_combinations_40_adjusted_no_dividends_1d.manifest.json")
          print(json.loads(path.read_text(encoding="utf-8"))["end"])
          PY
          )"
          python scripts/audit_backtest_readiness.py \
            --max-age-calendar-days 4 \
            --expected-end "$MATRIX_END" \
            --allow-historical-cutoff \
            --output reports/backtest_data_audit_40.json

      - name: Preparar latest recuperado
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          PUBLISH_DIR="$RUNNER_TEMP/backtest-results-publish"
          RECOVERED_DIR="$RUNNER_TEMP/recovered-latest"
          PRESERVED_DIR="$RUNNER_TEMP/preserved-latest"
          rm -rf "$PUBLISH_DIR" "$RECOVERED_DIR" "$PRESERVED_DIR"
          mkdir -p "$RECOVERED_DIR" "$PRESERVED_DIR"
          cp reports/TOP_10.md "$RECOVERED_DIR/RESEARCH_TOP_10.md"
          cp reports/TOP_10.json "$RECOVERED_DIR/RESEARCH_TOP_10.json"
          cp reports/strategy_management_combinations_40_adjusted_no_dividends_1d.audit.json "$RECOVERED_DIR/AUDIT.json"
          cp reports/strategy_management_combinations_40_adjusted_no_dividends_1d.manifest.json "$RECOVERED_DIR/MANIFEST.json"
          cp reports/strategy_management_combinations_40_adjusted_no_dividends_1d_top10_annual.md "$RECOVERED_DIR/RESEARCH_TOP_10_ANNUAL.md"
          cp reports/strategy_management_combinations_40_adjusted_no_dividends_1d.csv.gz "$RECOVERED_DIR/MATRIX.csv.gz"
          cp reports/backtest_data_audit_40.json "$RECOVERED_DIR/DATA_READINESS.json"
          git fetch origin backtest-results:refs/remotes/origin/backtest-results
          git worktree add --detach "$PUBLISH_DIR" origin/backtest-results
          for name in \
            REALISTIC_INPUT_SNAPSHOT.tar.gz \
            REALISTIC_INPUT_SNAPSHOT.sha256 \
            REALISTIC_INPUT_AUDIT.json; do
            if [ -f "$PUBLISH_DIR/reports/latest_backtest/$name" ]; then
              cp "$PUBLISH_DIR/reports/latest_backtest/$name" "$PRESERVED_DIR/$name"
            fi
          done
          snapshot_exists=false
          checksum_exists=false
          [ -f "$PRESERVED_DIR/REALISTIC_INPUT_SNAPSHOT.tar.gz" ] && snapshot_exists=true
          [ -f "$PRESERVED_DIR/REALISTIC_INPUT_SNAPSHOT.sha256" ] && checksum_exists=true
          if [ "$snapshot_exists" != "$checksum_exists" ]; then
            echo "::error::snapshot/checksum realista assimétricos em backtest-results"
            exit 1
          fi
          if [ "$snapshot_exists" = "true" ]; then
            (
              cd "$PRESERVED_DIR"
              sha256sum -c REALISTIC_INPUT_SNAPSHOT.sha256
            )
          fi
          rm -rf "$PUBLISH_DIR/reports/latest_backtest"
          mkdir -p "$PUBLISH_DIR/reports/latest_backtest"
          cp "$RECOVERED_DIR"/* "$PUBLISH_DIR/reports/latest_backtest/"
          for preserved in "$PRESERVED_DIR"/*; do
            if [ -f "$preserved" ]; then
              cp "$preserved" "$PUBLISH_DIR/reports/latest_backtest/"
            fi
          done
          cp reports/backtest_data_audit_40.json "$PUBLISH_DIR/reports/backtest_data_audit_40.json"
          for data_root in data/candles data/manifests data/corporate_actions; do
            rm -rf "$PUBLISH_DIR/$data_root"
            mkdir -p "$PUBLISH_DIR/$(dirname "$data_root")"
            cp -a "$data_root" "$PUBLISH_DIR/$data_root"
          done
          cp data/universes/fixed_40_2018.json "$PUBLISH_DIR/data/universes/fixed_40_2018.json"
          cp data/quality_reviews.json "$PUBLISH_DIR/data/quality_reviews.json"
          SOURCE_PATHS="$RUNNER_TEMP/recovery-source-paths.txt"
          python - <<'PY' > "$SOURCE_PATHS"
          import json
          from pathlib import Path
          manifest = json.loads(
              Path("reports/strategy_management_combinations_40_adjusted_no_dividends_1d.manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          for raw in sorted(manifest["source_sha256"]):
              path = Path(raw)
              if path.is_absolute() or ".." in path.parts or not path.is_file():
                  raise SystemExit(f"invalid recovery source path: {raw}")
              print(path.as_posix())
          PY
          while IFS= read -r source_path; do
            mkdir -p "$PUBLISH_DIR/$(dirname "$source_path")"
            cp "$source_path" "$PUBLISH_DIR/$source_path"
          done < "$SOURCE_PATHS"
          export PUBLISH_DIR
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          latest = Path(os.environ["PUBLISH_DIR"]) / "reports/latest_backtest"
          audit = json.loads((latest / "AUDIT.json").read_text())
          manifest = json.loads((latest / "MANIFEST.json").read_text())
          readiness_path = latest / "DATA_READINESS.json"
          readiness = json.loads(readiness_path.read_text()) if readiness_path.exists() else None
          if audit.get("ready_for_research_ranking") is not True:
              raise SystemExit("auditoria do recovery não está pronta")
          snapshot_exists = (latest / "REALISTIC_INPUT_SNAPSHOT.tar.gz").exists()
          payload = {
              "status": "RESEARCH_SUCCESS_REALISTIC_BLOCKED",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "recovery_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "recovery_workflow_sha": os.environ["GITHUB_SHA"],
              "calculation_sha": manifest.get("git_commit"),
              "strategy_count": int(manifest["strategy_count"]),
              "management_count": int(manifest["management_count"]),
              "combination_count": int(manifest["combinations"]),
              "top_n": 10,
              "research_ranking_ready": True,
              "research_matrix_completed": True,
              "research_matrix_real_money_ready": False,
              "realistic_finalist_validation_ready": False,
              "result_classification": audit.get("result_classification"),
              "data_cutoff": readiness.get("evaluation_end") if readiness else None,
              "data_freshness_reference_date": (
                  readiness.get("freshness_reference_date") if readiness else None
              ),
              "data_age_calendar_days": (
                  readiness.get("age_calendar_days") if readiness else None
              ),
              "data_is_recent": readiness.get("data_is_recent") if readiness else None,
              "historical_cutoff_accepted": (
                  readiness.get("historical_cutoff_accepted") if readiness else None
              ),
              "real_money_claim_allowed": False,
              "counterfactual_execution_exact": False,
              "ex_ante_selection_claim_allowed": False,
              "selection_bias_remaining": True,
              "verified_data_snapshot_included": True,
              "verified_data_snapshot_paths": [
                  "data/candles",
                  "data/manifests",
                  "data/corporate_actions",
                  "data/universes/fixed_40_2018.json",
                  "data/quality_reviews.json",
              ],
              "recovery_source_hashes_verified": True,
              "research_matrix_path": "reports/latest_backtest/MATRIX.csv.gz",
              "realistic_input_snapshot_path": (
                  "reports/latest_backtest/REALISTIC_INPUT_SNAPSHOT.tar.gz"
                  if snapshot_exists else None
              ),
              "realistic_input_snapshot_current_run": False,
              "realistic_input_snapshot_reused": snapshot_exists,
              "realistic_input_audit_current_run": False,
          }
          (latest / "STATUS.json").write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n")
          (latest / "REALISTIC_VALIDATION_BLOCKED.md").write_text(
              "# Matriz de pesquisa recuperada; validação realista não reexecutada\n\n"
              + json.dumps(payload, indent=2, ensure_ascii=False)
              + "\n"
          )
          PY

      - name: Publicar em backtest-results
        run: |
          set -euo pipefail
          PUBLISH_DIR="$RUNNER_TEMP/backtest-results-publish"
          SOURCE_PATHS="$RUNNER_TEMP/recovery-source-paths.txt"
          git -C "$PUBLISH_DIR" config user.name "github-actions[bot]"
          git -C "$PUBLISH_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PUBLISH_DIR" add -A -- \
            data \
            reports/backtest_data_audit_40.json \
            reports/latest_backtest
          while IFS= read -r source_path; do
            git -C "$PUBLISH_DIR" add -- "$source_path"
          done < "$SOURCE_PATHS"
          git -C "$PUBLISH_DIR" commit -m "Backtest recovery ${{ github.run_number }}: publish [skip ci]"
          git -C "$PUBLISH_DIR" push origin HEAD:backtest-results
