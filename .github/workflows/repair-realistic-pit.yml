name: Temporary clean-tree PIT validator

on:
  push:
    branches:
      - fix/realistic-pit-integrity-20260904
    paths:
      - '.github/workflows/repair-realistic-pit.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validate-clean-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repair harnesses are gone
        run: |
          set -euo pipefail
          if find scripts -maxdepth 1 -type f -name '_temporary_*' | grep -q .; then
            echo '::error::temporary scripts remain in the branch'
            find scripts -maxdepth 1 -type f -name '_temporary_*' -print
            exit 1
          fi
          test ! -e .github/workflows/repair-publication-semantics.yml
          test ! -e reports/_validated_full_matrix_backtest_hardened.yml
          grep -q 'cancel-in-progress: false' .github/workflows/full-matrix-backtest-hardened.yml
      - name: Validate final clean tree
        run: |
          set -euo pipefail
          python -m json.tool data/corporate_actions/instrument_transition_reviews.json >/dev/null
          python -m py_compile \
            b3_strategy_lab/cotahist.py \
            b3_strategy_lab/instrument_transitions.py \
            b3_strategy_lab/point_in_time.py \
            b3_strategy_lab/realistic_core.py \
            b3_strategy_lab/realistic_portfolio.py \
            b3_strategy_lab/realistic_portfolio_core.py \
            scripts/build_cash_distribution_coverage_certification.py \
            scripts/build_survivorship_safe_realistic_universe.py \
            scripts/build_ticker_transitions.py \
            scripts/sync_point_in_time_universe.py
          python -m unittest discover -s tests -v
          git diff --check

# retrigger after validated cleanup
