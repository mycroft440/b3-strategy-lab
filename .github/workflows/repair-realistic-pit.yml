name: Temporary PIT repair batch 1

on:
  push:
    branches:
      - fix/realistic-pit-integrity-20260904
    paths:
      - '.github/workflows/repair-realistic-pit.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  repair-bdi58:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped CODBDI 58 source fix
        run: |
          set -euo pipefail
          python scripts/_temporary_pit_repair_batch1.py
          python -m py_compile b3_strategy_lab/cotahist.py b3_strategy_lab/point_in_time.py scripts/sync_official_universe.py tests/test_bdi58_goll4_regression.py
          python -m unittest tests.test_bdi58_goll4_regression -v
          python -m unittest discover -s tests -v
      - name: Commit verified source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add b3_strategy_lab/cotahist.py b3_strategy_lab/point_in_time.py scripts/sync_official_universe.py
          git diff --cached --check
          git commit -m 'fix: preserve BDI58 company-share continuity'
          git push origin HEAD:fix/realistic-pit-integrity-20260904
      - name: Rebuild PIT universe and enumerate all historical transition blockers
        run: |
          set -euo pipefail
          rm -rf reports/pit-batch1
          mkdir -p reports/pit-batch1
          python scripts/build_survivorship_safe_realistic_universe.py --start 2018-01-02 --end 2026-08-19 --years 2017:2026 --download
          python scripts/build_ticker_transitions.py --years 2017:2026 --end 2026-08-19 --download --unresolved-output reports/pit-batch1/unresolved_historical_delistings.csv
          echo '=== ALL TRANSITION BLOCKERS ==='
          cat reports/pit-batch1/unresolved_historical_delistings.csv
