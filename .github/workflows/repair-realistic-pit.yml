name: Temporary PIT repair batch 3c

on:
  push:
    branches:
      - fix/realistic-pit-integrity-20260904
    paths:
      - '.github/workflows/repair-realistic-pit.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  audit-and-cash-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply strict certification/audit patches and run full suite
        run: |
          set -euo pipefail
          python scripts/_temporary_pit_repair_batch3.py
          python -m py_compile \
            b3_strategy_lab/realistic_core.py \
            b3_strategy_lab/realistic.py \
            scripts/build_cash_distribution_coverage_certification.py \
            scripts/sync_point_in_time_universe.py \
            tests/test_pit_audit_and_cash_timing_certification.py \
            tests/test_realistic_accounting.py
          python -m unittest tests.test_cash_coverage_schema_v2 tests.test_pit_audit_and_cash_timing_certification -v
          python -m unittest discover -s tests -v
      - name: Commit verified production and contract changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            b3_strategy_lab/realistic_core.py \
            scripts/build_cash_distribution_coverage_certification.py \
            scripts/sync_point_in_time_universe.py \
            tests/test_realistic_accounting.py
          git diff --cached --check
          git commit -m 'feat: require causal cash certification and add PIT audit mode'
          git push origin HEAD:fix/realistic-pit-integrity-20260904
