name: Temporary publish validated PIT patch

on:
  push:
    branches:
      - fix/realistic-pit-integrity-20260904
    paths:
      - '.github/workflows/repair-realistic-pit.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  publish-validated-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce validated production patch
        run: |
          set -euo pipefail
          python scripts/_temporary_transition_review_batch6.py
          python scripts/_temporary_transition_review_batch6_post.py
          python scripts/_temporary_transition_review_batch7.py
          python scripts/_temporary_final_hardening.py
          python scripts/_temporary_final_test_contracts.py
          python -m json.tool data/corporate_actions/instrument_transition_reviews.json >/dev/null
          python -m py_compile \
            b3_strategy_lab/cotahist.py \
            b3_strategy_lab/realistic_portfolio.py \
            tests/test_bdi58_goll4_regression.py \
            tests/test_instrument_transition_layer.py \
            tests/test_realistic_snapshot_certification_gate.py \
            tests/test_hardened_backtest_performance_settings.py \
            tests/test_hardened_workflow_snapshot_bootstrap.py \
            tests/test_realistic_snapshot_reuse_window.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Push non-workflow files and export validated workflow text
        run: |
          set -euo pipefail
          mkdir -p reports
          cp .github/workflows/full-matrix-backtest-hardened.yml reports/_validated_full_matrix_backtest_hardened.yml
          git checkout -- .github/workflows/full-matrix-backtest-hardened.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/corporate_actions/instrument_transition_reviews.json \
            b3_strategy_lab/cotahist.py \
            b3_strategy_lab/realistic_portfolio.py \
            tests/test_bdi58_goll4_regression.py \
            tests/test_instrument_transition_layer.py \
            tests/test_realistic_snapshot_certification_gate.py \
            tests/test_hardened_backtest_performance_settings.py \
            tests/test_hardened_workflow_snapshot_bootstrap.py \
            tests/test_realistic_snapshot_reuse_window.py \
            reports/_validated_full_matrix_backtest_hardened.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No non-workflow patch changes to publish.'
          else
            git commit -m 'fix: close PIT transition chain and harden publication gates'
            git push origin HEAD:fix/realistic-pit-integrity-20260904
          fi
