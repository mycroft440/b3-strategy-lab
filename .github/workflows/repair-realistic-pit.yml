name: Temporary PIT transition rebuild batch 4

on:
  push:
    branches:
      - fix/realistic-pit-integrity-20260904
    paths:
      - '.github/workflows/repair-realistic-pit.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  rebuild-transitions:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source-backed transition repairs and validate full suite
        run: |
          set -euo pipefail
          python scripts/_temporary_transition_review_batch6.py
          python scripts/_temporary_transition_review_batch6_post.py
          python -m json.tool data/corporate_actions/instrument_transition_reviews.json >/dev/null
          python -m py_compile \
            b3_strategy_lab/realistic_portfolio.py \
            scripts/_temporary_transition_review_batch6.py \
            scripts/_temporary_transition_review_batch6_post.py \
            tests/test_instrument_transition_layer.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Rebuild point-in-time scope and require complete transition classification
        run: |
          set -euo pipefail
          rm -rf reports/pit-transition-rebuild
          mkdir -p reports/pit-transition-rebuild
          python scripts/build_survivorship_safe_realistic_universe.py \
            --start 2018-01-02 --end 2026-08-19 --years 2017:2026 --download
          python scripts/build_ticker_transitions.py \
            --years 2017:2026 --end 2026-08-19 --download \
            --unresolved-output reports/pit-transition-rebuild/unresolved.csv
          python - <<'PY'
          import csv, json
          from pathlib import Path
          manifest = json.loads(Path('data/corporate_actions/ticker_transitions.manifest.json').read_text())
          rows = list(csv.DictReader(Path('reports/pit-transition-rebuild/unresolved.csv').open()))
          print('OLDER_UNRESOLVED', manifest['older_unresolved_disappearances'])
          print('TOTAL_UNRESOLVED', manifest['unresolved_disappearances'])
          print('TRANSITION_ROWS', manifest['transition_row_count'])
          print('MARKET_DATA_TICKERS', manifest['scoped_ticker_count'])
          print('UNRESOLVED_TICKERS', ','.join(row['ticker'] for row in rows))
          for row in rows:
              print('UNRESOLVED_ROW', json.dumps(row, sort_keys=True, ensure_ascii=False))
          if manifest['older_unresolved_disappearances'] != 0:
              raise SystemExit('older unresolved PIT disappearances remain')
          if manifest['unresolved_disappearances'] != 0 or rows:
              raise SystemExit('unresolved PIT disappearances remain')
          if manifest.get('complete') is not True:
              raise SystemExit('transition manifest is not complete')
          PY
          git diff --check
      - name: Commit tested production repairs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/corporate_actions/instrument_transition_reviews.json \
            b3_strategy_lab/realistic_portfolio.py \
            tests/test_instrument_transition_layer.py
          git diff --cached --check
          git commit -m 'fix: certify remaining PIT instrument transitions'
          git push origin HEAD:fix/realistic-pit-integrity-20260904
