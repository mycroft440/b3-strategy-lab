name: Finalize simple backtest correctness fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/simple-backtest-fixes-final.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reuse audited patch blocks and update terminal-trade expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/simple-backtest-fixes.yml').read_text(encoding='utf-8')
          lines = workflow.splitlines()
          blocks = []
          current = None
          for line in lines:
              if line.strip() == "python - <<'PY'":
                  current = []
                  continue
              if current is not None and line.strip() == 'PY':
                  blocks.append(textwrap.dedent('\n'.join(current)))
                  current = None
                  continue
              if current is not None:
                  current.append(line)

          if len(blocks) != 2:
              raise SystemExit(f'expected 2 Python patch blocks, found {len(blocks)}')
          for index, block in enumerate(blocks, start=1):
              exec(compile(block, f'<reused-patch-{index}>', 'exec'), {})

          test = Path('tests/test_portfolio_allocation.py')
          text = test.read_text(encoding='utf-8')
          old = '''        self.assertEqual(\n            [point.selected for point in curve],\n            ["AAA3", "AAA3", "", "AAA3"],\n        )\n        self.assertEqual(summary.trades, 3)\n'''
          new = '''        self.assertEqual(\n            [point.selected for point in curve],\n            ["AAA3", "AAA3", "", "AAA3"],\n        )\n        # Three strategy/management trades plus the mandatory terminal liquidation.\n        self.assertEqual(summary.trades, 4)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'terminal trade expectation block count={text.count(old)}')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused tests
        run: python -m pytest -q tests/test_simple_backtest_fixes.py tests/test_portfolio_allocation.py

      - name: Run full test suite
        run: python -m pytest -q

      - name: Commit tested fixes to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/simple-backtest-fixes.yml .github/workflows/simple-backtest-fixes-final.yml
          git add scripts/research_portfolio_allocation_core.py \
                  scripts/backtest_strategy_management_combinations.py \
                  scripts/audit_matrix_results.py \
                  tests/test_simple_backtest_fixes.py \
                  tests/test_portfolio_allocation.py
          git commit -m "fix: liquidate final positions and correct annual average [skip ci]"
          git push origin HEAD:main
