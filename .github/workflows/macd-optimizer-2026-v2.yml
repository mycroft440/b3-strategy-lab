name: MACD 40 ações - otimização exaustiva 2026 v2

on:
  push:
    branches:
      - macd-optimizer-2026
    paths:
      - ".github/workflows/macd-optimizer-2026-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy numba yfinance
      - name: Exhaustive MACD sweep 1..50
        run: python tools/macd_optimizer_2026.py --min 1 --max 50 --out artifacts/macd_optimizer_2026
      - name: Show winner
        run: cat artifacts/macd_optimizer_2026/optimizer_summary.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: macd-optimizer-2026
          path: artifacts/macd_optimizer_2026/
          if-no-files-found: error
