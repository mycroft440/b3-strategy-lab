name: Patch full matrix concurrency once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-full-matrix-concurrency-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep only latest matrix and compile expanded catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/full-matrix-backtest-hardened.yml')
          text = path.read_text(encoding='utf-8')
          old = '  cancel-in-progress: false\n'
          new = '  cancel-in-progress: true\n'
          if old not in text:
              raise SystemExit('concurrency setting not found')
          text = text.replace(old, new, 1)
          old = '''          python -m py_compile \\
            b3_strategy_lab/extended_strategies.py \\
            b3_strategy_lab/realistic_portfolio.py \\
'''
          new = '''          python -m py_compile \\
            b3_strategy_lab/extended_strategies.py \\
            b3_strategy_lab/research_indicators.py \\
            b3_strategy_lab/indicator_strategies.py \\
            b3_strategy_lab/trend_strategies.py \\
            b3_strategy_lab/realistic_portfolio.py \\
'''
          if old not in text:
              raise SystemExit('compile block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch-full-matrix-concurrency-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/full-matrix-backtest-hardened.yml .github/workflows/patch-full-matrix-concurrency-once.yml
          git commit -m "Run only latest expanded full-matrix backtest"
          git push origin HEAD:main
