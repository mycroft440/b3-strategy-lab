name: Recover backtest merge

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run ID que contém os 32 shards concluídos
        required: true
        default: "32324507993"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover-backtest-merge.yml"

permissions:
  actions: read
  contents: write

jobs:
  recover:
    name: Recuperar, consolidar e auditar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '32324507993' }}
      TOP_N: "10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar os 32 shards do run concluído
        uses: actions/download-artifact@v4
        with:
          pattern: matrix-shard-*
          path: reports/shards
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Verificar cobertura dos shards
        run: |
          set -euo pipefail
          mkdir -p reports/latest_backtest
          python - <<'PY'
          from pathlib import Path
          results = sorted(Path('reports/shards').glob('shard_*.csv.gz'))
          manifests = sorted(Path('reports/shards').glob('shard_*.manifest.json'))
          annual = sorted(Path('reports/shards').glob('shard_*_top10_annual.md'))
          print('results', len(results), 'manifests', len(manifests), 'annual', len(annual))
          assert len(results) == 32, f'esperados 32 CSVs, encontrados {len(results)}'
          assert len(manifests) == 32, f'esperados 32 manifestos, encontrados {len(manifests)}'
          assert len(annual) == 32, f'esperados 32 relatórios anuais, encontrados {len(annual)}'
          PY

      - name: Consolidar ranking global com diagnóstico
        id: merge
        shell: bash
        run: |
          set +e
          python scripts/merge_matrix_shards.py \
            --input-dir reports/shards \
            --top "$TOP_N" \
            --output reports/strategy_management_combinations_40_adjusted_no_dividends_1d.csv.gz \
            --summary-output reports/TOP_10.md \
            --json-output reports/TOP_10.json \
            2>&1 | tee reports/latest_backtest/MERGE_LOG.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Auditar resultado consolidado
        id: audit
        if: ${{ steps.merge.outputs.rc == '0' }}
        shell: bash
        run: |
          set +e
          python scripts/audit_matrix_results.py \
            --results reports/strategy_management_combinations_40_adjusted_no_dividends_1d.csv.gz \
            --annual-report reports/strategy_management_combinations_40_adjusted_no_dividends_1d_top10_annual.md \
            --output reports/strategy_management_combinations_40_adjusted_no_dividends_1d.audit.json \
            2>&1 | tee reports/latest_backtest/AUDIT_LOG.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preparar resultado verificável
        env:
          MERGE_RC: ${{ steps.merge.outputs.rc }}
          AUDIT_RC: ${{ steps.audit.outputs.rc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          latest = Path('reports/latest_backtest')
          merge_ok = os.environ.get('MERGE_RC') == '0'
          audit_ok = os.environ.get('AUDIT_RC') == '0'
          audit_path = Path('reports/strategy_management_combinations_40_adjusted_no_dividends_1d.audit.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8')) if audit_path.exists() else None
          ready = bool(merge_ok and audit_ok and audit and audit.get('ready') is True)

          if merge_ok:
              copies = {
                  Path('reports/TOP_10.md'): latest / 'TOP_10.md',
                  Path('reports/TOP_10.json'): latest / 'TOP_10.json',
                  Path('reports/strategy_management_combinations_40_adjusted_no_dividends_1d.manifest.json'): latest / 'MANIFEST.json',
                  Path('reports/strategy_management_combinations_40_adjusted_no_dividends_1d_top10_annual.md'): latest / 'TOP_10_ANNUAL.md',
              }
              if audit_path.exists():
                  copies[audit_path] = latest / 'AUDIT.json'
              for src, dst in copies.items():
                  if src.exists():
                      dst.write_bytes(src.read_bytes())

          payload = {
              'status': 'SUCCESS' if ready else 'FAILED',
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'recovery_run_id': int(os.environ['GITHUB_RUN_ID']),
              'source_run_id': int(os.environ['SOURCE_RUN_ID']),
              'source_sha': os.environ['GITHUB_SHA'],
              'strategy_count': 190,
              'management_count': 478,
              'combination_count': 90820,
              'top_n': 10,
              'merge_rc': int(os.environ.get('MERGE_RC') or -1),
              'audit_rc': int(os.environ.get('AUDIT_RC') or -1),
              'audit_ready': ready,
          }
          (latest / 'STATUS.json').write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload, indent=2))
          PY

      - name: Publicar diagnóstico/resultado em backtest-results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/latest_backtest
          git commit -m "Backtest recovery ${{ github.run_number }}: publish merge result [skip ci]"
          git push --force origin HEAD:backtest-results

      - name: Exigir resultado aprovado
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('reports/latest_backtest/STATUS.json').read_text())
          if status['status'] != 'SUCCESS':
              raise SystemExit('merge/auditoria ainda não aprovados')
          PY
