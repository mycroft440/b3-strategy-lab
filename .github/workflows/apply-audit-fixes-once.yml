name: Apply comprehensive audit fixes once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-audit-fixes-once.yml

permissions:
  contents: write

concurrency:
  group: comprehensive-audit-fixes
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate patch payload
        run: python -m py_compile .github/patches/apply_audit_fixes.py

      - name: Apply fixes
        run: |
          python .github/patches/apply_audit_fixes.py
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_comprehensive_audit_fixes.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '_weekday_gap(date(2024, 3, 28), date(2024, 4, 2)), 1)',
              '_weekday_gap(date(2024, 3, 28), date(2024, 4, 2)), 2)',
          )
          text = text.replace(
              'self.assertEqual(metrics["total_return"], -0.1)',
              'self.assertAlmostEqual(metrics["total_return"], -0.1)',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_realistic_artifact_reconciliation.py')
          text = path.read_text(encoding='utf-8')
          anchor = '            "final_equity": 1000.0,\n            "annual_volatility": 0.0,\n'
          if anchor not in text:
              raise SystemExit('artifact fixture anchor missing')
          text = text.replace(
              anchor,
              '            "final_equity": 1000.0,\n            "max_drawdown": 0.0,\n            "annual_volatility": 0.0,\n',
              1,
          )
          cases = '            "sharpe": "curve_sharpe_mismatch",\n            "average_annual_return": "curve_average_annual_return_mismatch",\n'
          if cases not in text:
              raise SystemExit('artifact metric cases anchor missing')
          text = text.replace(
              cases,
              '            "sharpe": "curve_sharpe_mismatch",\n            "max_drawdown": "curve_max_drawdown_mismatch",\n            "average_annual_return": "curve_average_annual_return_mismatch",\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile critical modules
        run: |
          python -m py_compile \
            b3_strategy_lab/cash_distributions.py \
            b3_strategy_lab/realistic_certification.py \
            scripts/audit_backtest_readiness.py \
            scripts/audit_realistic_backtest_inputs.py \
            scripts/build_survivorship_safe_realistic_universe.py \
            scripts/build_ticker_transitions.py \
            scripts/research_portfolio_allocation_core.py \
            scripts/sync_point_in_time_universe.py \
            scripts/validate_matrix_top_realistic.py

      - name: Run new regression tests
        run: python -m unittest discover -s tests -p 'test_comprehensive_audit_fixes.py' -v

      - name: Run related regression suites
        run: |
          python -m unittest discover -s tests -p 'test_realistic_artifact_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_realistic_ranking_gate.py' -v
          python -m unittest discover -s tests -p 'test_ticker_transition_horizon.py' -v
          python -m unittest discover -s tests -p 'test_point_in_time_historical_issuers.py' -v
          python -m unittest discover -s tests -p 'test_cash_coverage_ticker_scope.py' -v

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Verify hardened invariants
        run: |
          grep -F -- '--require-valid "$TOP_N"' .github/workflows/full-matrix-backtest-hardened.yml
          grep -F 'historical_cash_dividend_source_unavailable' b3_strategy_lab/cash_distributions.py
          grep -F 'validation_passed' scripts/validate_matrix_top_realistic.py
          grep -F 'behavioral_uniqueness_claimed' scripts/backtest_strategy_management_combinations.py
          grep -F 'execution_coverage_scope' scripts/audit_realistic_backtest_inputs.py

      - name: Commit audited fixes to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-audit-fixes-once.yml
          git rm .github/patches/apply_audit_fixes.py
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden backtest certification after critical audit [skip ci]'
          git push origin HEAD:main
