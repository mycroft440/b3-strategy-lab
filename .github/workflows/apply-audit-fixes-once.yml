                {"date": "2024-02-01", "side": "SELL", "ticker": "AAA3", "quantity": 10},
            ]
            issues = bonus_tax_basis_dependencies(split, trades, start="2024-01-01", end="2024-12-31")
            self.assertEqual(len(issues), 1)
            self.assertEqual(issues[0]["bonus_ex_date"], "2024-01-15")


