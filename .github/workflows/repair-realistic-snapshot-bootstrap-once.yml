name: Repair realistic snapshot bootstrap once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-realistic-snapshot-bootstrap-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact repair
        run: python .github/repair/repair_realistic_snapshot_bootstrap.py

      - name: Run regression test
        run: python -m unittest tests.test_full_matrix_workflow_bootstrap -v

      - name: Run full repository test suite
        run: python -m unittest discover -s tests -v

      - name: Commit tested repair to main
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-realistic-snapshot-bootstrap-once.yml
          git rm .github/repair/repair_realistic_snapshot_bootstrap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/full-matrix-backtest-hardened.yml tests/test_full_matrix_workflow_bootstrap.py
          git commit -m "fix: bootstrap certified realistic snapshot when absent"
          git push origin HEAD:main
