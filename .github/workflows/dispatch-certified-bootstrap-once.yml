name: Dispatch certified PIT bootstrap once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-certified-bootstrap-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full hardened backtest with certified refresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"start":"2018-01-02","end":"","refresh_data":"true","initial_cash":"1000","cost_bps":"3.2","slippage_bps":"10"}}'
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/full-matrix-backtest-hardened.yml/dispatches" \
            -d "$payload"
