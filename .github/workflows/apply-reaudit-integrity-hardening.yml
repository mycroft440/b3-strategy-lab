name: Apply re-audit integrity hardening

on:
  push:
    branches:
      - fix/reaudit-integrity-hardening

permissions:
  contents: write

jobs:
  apply-test-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply audited edits
        run: python .github/apply_reaudit_hardening.py

      - name: Correct empty-ledger test expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_realistic_artifact_reconciliation.py")
          text = path.read_text(encoding="utf-8")
          old = '''            self.assertIn("empty_tax_ledger", issues)\n            self.assertIn("tax_ledger_month_coverage_mismatch", issues)\n'''
          new = '''            self.assertIn("empty_tax_ledger", issues)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"empty-ledger expectation target count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Compile affected Python
        run: |
          python -m py_compile \
            scripts/validate_matrix_top_realistic.py \
            tests/test_realistic_artifact_reconciliation.py \
            tests/test_workflow_integrity_contracts.py

      - name: Run focused integrity tests
        run: |
          python -m unittest \
            tests.test_realistic_artifact_reconciliation \
            tests.test_workflow_integrity_contracts \
            tests.test_realistic_ranking_gate -v

      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v

      - name: Stage final recovery workflow outside workflows directory
        run: |
          set -euo pipefail
          mkdir -p .github/staged-reaudit
          cp .github/workflows/recover-backtest-merge-hardened.yml \
            .github/staged-reaudit/recover-backtest-merge-hardened.yml
          git checkout -- .github/workflows/recover-backtest-merge-hardened.yml
          rm .github/apply_reaudit_hardening.py

      - name: Publish validated code and staging file
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            scripts/validate_matrix_top_realistic.py \
            tests/test_realistic_artifact_reconciliation.py \
            tests/test_workflow_integrity_contracts.py \
            .github/staged-reaudit/recover-backtest-merge-hardened.yml \
            .github/apply_reaudit_hardening.py
          git diff --cached --check
          git commit -m "Close recovery data and tax-ledger integrity gaps"
          git push origin HEAD:fix/reaudit-integrity-hardening
