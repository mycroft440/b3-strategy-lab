name: Apply integrity hardening patch v2

on:
  push:
    branches:
      - fix/recovery-realistic-integrity

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tighten recovery import replacement target
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/apply_integrity_hardening.py')
          text = path.read_text(encoding='utf-8')
          old = '''path = ".github/workflows/recover-backtest-merge-hardened.yml"
          old = \'\'\'          import json
                    from pathlib import Path
          \'\'\'
          new = \'\'\'          import json, os
                    from pathlib import Path
          \'\'\'
          replace_once(path, old, new)
          '''
          new = '''path = ".github/workflows/recover-backtest-merge-hardened.yml"
          old = \'\'\'      - name: Validar conjunto de shards
                  run: |
                    python - <<\'PY\'
                    import json
                    from pathlib import Path
          \'\'\'
          new = \'\'\'      - name: Validar conjunto de shards
                  run: |
                    python - <<\'PY\'
                    import json, os
                    from pathlib import Path
          \'\'\'
          replace_once(path, old, new)
          '''
          if text.count(old) != 1:
              raise SystemExit(f'helper recovery import block count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply deterministic hardening edits
        run: python .github/apply_integrity_hardening.py

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            scripts/validate_matrix_top_realistic.py \
            tests/test_realistic_artifact_reconciliation.py \
            tests/test_workflow_integrity_contracts.py

      - name: Run focused regression tests
        run: |
          python -m unittest \
            tests.test_realistic_artifact_reconciliation \
            tests.test_workflow_integrity_contracts \
            tests.test_realistic_ranking_gate -v

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Commit hardened implementation
        run: |
          set -euo pipefail
          rm .github/apply_integrity_hardening.py
          rm .github/workflows/apply-integrity-hardening.yml
          rm .github/workflows/apply-integrity-hardening-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bind recovery provenance and realistic output gates"
          git push origin HEAD:fix/recovery-realistic-integrity
