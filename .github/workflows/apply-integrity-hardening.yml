name: Apply integrity hardening patch

on:
  push:
    branches:
      - fix/recovery-realistic-integrity

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic hardening edits
        run: python .github/apply_integrity_hardening.py

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            scripts/validate_matrix_top_realistic.py \
            tests/test_realistic_artifact_reconciliation.py \
            tests/test_workflow_integrity_contracts.py

      - name: Run focused regression tests
        run: |
          python -m unittest \
            tests.test_realistic_artifact_reconciliation \
            tests.test_workflow_integrity_contracts \
            tests.test_realistic_ranking_gate -v

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Commit hardened implementation
        run: |
          set -euo pipefail
          rm .github/apply_integrity_hardening.py
          rm .github/workflows/apply-integrity-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bind recovery provenance and realistic output gates"
          git push origin HEAD:fix/recovery-realistic-integrity
