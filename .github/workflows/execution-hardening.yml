                  buy_plan = best

              for ticker in sorted(buy_plan):
                  quantity = buy_plan[ticker]
                  if quantity <= 0:
                      continue
                  for qty, quote in pricebook.legs(current, ticker, quantity):
                      trial.buy_leg(current, ticker, qty, quote)
          ''',
