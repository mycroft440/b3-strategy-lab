def candle(day: str, ticker: str, price: float) -> Candle:
    return Candle(
        date=day,
        ticker=ticker,
        source_symbol=ticker,
        open=price,
        high=price,
        low=price,
        close=price,
        adj_close=price,
        volume=1000,
        raw_open=price,
