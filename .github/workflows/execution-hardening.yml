name: Execution hardening validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/execution-hardening-20260820
      - name: Source hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in (
              "scripts/_execution_hardening_source.py",
              "scripts/_execution_hardening_causality_fix.py",
          ):
              source = Path(filename).read_text(encoding="utf-8")
              exec(compile(source, filename, "exec"), {})
          PY
