name: Execution hardening validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/execution-hardening-20260820
      - name: Source hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("scripts/_execution_hardening_source.py").read_text(encoding="utf-8")
          exec(compile(source, "execution-hardening-source", "exec"), {})
          PY
