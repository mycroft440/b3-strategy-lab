name: Apply simple backtest correctness fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/simple-backtest-fixes.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply targeted fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          core = "scripts/research_portfolio_allocation_core.py"

          replace_once(
              core,
              '''    yearly = _yearly_returns(equities, dates, initial_cash)\n''',
              '''    yearly = _full_calendar_year_returns(equities, dates, initial_cash)\n''',
          )

          replace_once(
              core,
              '''        invested_value = sum(\n            shares[ticker] * today_candles[ticker].close for ticker in selected\n        )\n        equity = cash + invested_value\n        invested_weight = invested_value / equity if equity > 0 else 0.0\n        equities.append(equity)\n        exposure_days += int(invested_weight > 0.01)\n        position_days += len(selected)\n''',
              '''        invested_value = sum(\n            shares[ticker] * today_candles[ticker].close for ticker in selected\n        )\n        mark_equity = cash + invested_value\n        exposure_weight = invested_value / mark_equity if mark_equity > 0 else 0.0\n        held_positions = len(selected)\n\n        # The research window ends in cash, not in an unliquidated mark-to-market.\n        # Preserve the final session's close-to-close P&L, then sell at that close\n        # with the same adverse slippage and transaction-cost assumptions used\n        # elsewhere. Exposure statistics still count the position as held that day.\n        if next_date is None and selected:\n            liquidation_trades, liquidation_turnover, cash = _liquidate_at_close(\n                current_date,\n                data.tickers,\n                today_candles,\n                shares,\n                cash,\n                cost_rate,\n                slippage_rate,\n            )\n            trade_count += liquidation_trades\n            turnover += liquidation_turnover\n            total_trades += liquidation_trades\n            total_turnover += liquidation_turnover\n            equity = cash\n            invested_weight = 0.0\n            selected_for_curve: list[str] = []\n        else:\n            equity = mark_equity\n            invested_weight = exposure_weight\n            selected_for_curve = selected\n\n        equities.append(equity)\n        exposure_days += int(exposure_weight > 0.01)\n        position_days += held_positions\n''',
          )

          replace_once(
              core,
              '''                    positions=len(selected),\n                    selected=";".join(selected),\n''',
              '''                    positions=len(selected_for_curve),\n                    selected=";".join(selected_for_curve),\n''',
          )

          replace_once(
              core,
              '''    return trade_count, traded_notional / equity, cash\n\n\ndef _write(rows: list[dict], output: Path) -> None:\n''',
              '''    return trade_count, traded_notional / equity, cash\n\n\ndef _liquidate_at_close(\n    current_date: str,\n    tickers: list[str],\n    today_candles: dict[str, Candle],\n    shares: dict[str, float],\n    cash: float,\n    cost_rate: float,\n    slippage_rate: float,\n) -> tuple[int, float, float]:\n    selected = [ticker for ticker in tickers if shares[ticker] > 0]\n    if not selected:\n        return 0, 0.0, cash\n\n    missing_closes = sorted(\n        ticker\n        for ticker in selected\n        if ticker not in today_candles or today_candles[ticker].close <= 0\n    )\n    if missing_closes:\n        raise ValueError(\n            f"{current_date}: fechamento fresco obrigatorio ausente para liquidacao final: "\n            + ", ".join(missing_closes)\n        )\n\n    marked_equity = cash + sum(\n        shares[ticker] * today_candles[ticker].close for ticker in selected\n    )\n    traded_notional = 0.0\n    trade_count = 0\n    for ticker in selected:\n        quantity = shares[ticker]\n        close_price = today_candles[ticker].close\n        execution_price = _slipped_price(close_price, "SELL", slippage_rate)\n        cash += quantity * execution_price * (1 - cost_rate)\n        shares[ticker] = 0.0\n        traded_notional += quantity * execution_price\n        trade_count += 1\n\n    turnover = traded_notional / marked_equity if marked_equity > 0 else 0.0\n    return trade_count, turnover, cash\n\n\ndef _write(rows: list[dict], output: Path) -> None:\n''',
          )

          replace_once(
              core,
              '''    return result\n\n\ndef _weights(selected: list[dict], config: PortfolioConfig) -> dict[str, float]:\n''',
              '''    return result\n\n\ndef _full_calendar_year_returns(\n    equities: list[float],\n    dates: list[str],\n    initial_equity: float,\n) -> dict[int, float]:\n    """Return only calendar years covered from the opening to closing sessions.\n\n    Partial first/last years are useful in the annual table but must not receive\n    the same weight as a full year in ``average_annual_return``. A complete B3\n    calendar year starts in the first week of January and ends in late December.\n    """\n\n    yearly = _yearly_returns(equities, dates, initial_equity)\n    if not yearly or not dates:\n        return {}\n\n    by_year: dict[int, list[date]] = {}\n    for value in dates:\n        current = _point_datetime(value).date()\n        by_year.setdefault(current.year, []).append(current)\n\n    complete: dict[int, float] = {}\n    for year, value in yearly.items():\n        sessions = by_year.get(year, [])\n        if not sessions:\n            continue\n        first_session = sessions[0]\n        last_session = sessions[-1]\n        starts_at_year_open = first_session.month == 1 and first_session.day <= 7\n        ends_at_year_close = last_session.month == 12 and last_session.day >= 20\n        if starts_at_year_open and ends_at_year_close:\n            complete[year] = value\n    return complete\n\n\ndef _weights(selected: list[dict], config: PortfolioConfig) -> dict[str, float]:\n''',
          )

          matrix = "scripts/backtest_strategy_management_combinations.py"
          replace_once(
              matrix,
              '''                f"Media de lucro por ano: {float(section['average']):.2%}",\n''',
              '''                f"Media dos anos-calendario completos: {float(section['average']):.2%}",\n''',
          )
          replace_once(
              matrix,
              '''            "standard_market_open_used_for_integer_share_research_execution",\n            "final_positions_marked_to_close_and_not_liquidated",\n''',
              '''            "standard_market_open_used_for_integer_share_research_execution",\n''',
          )
          replace_once(
              matrix,
              '''        "final_valuation": "mark_to_market_at_last_verified_close_not_liquidated",\n''',
              '''        "final_valuation": "liquidated_at_last_verified_close_with_costs_and_slippage",\n''',
          )

          audit = "scripts/audit_matrix_results.py"
          replace_once(
              audit,
              '''        "final_mark_to_market_is_not_mislabeled_as_liquidation": (\n            manifest.get("final_valuation")\n            == "mark_to_market_at_last_verified_close_not_liquidated"\n        ),\n''',
              '''        "final_positions_are_liquidated_with_costs_and_slippage": (\n            manifest.get("final_valuation")\n            == "liquidated_at_last_verified_close_with_costs_and_slippage"\n        ),\n''',
          )

          test_path = Path("tests/test_simple_backtest_fixes.py")
          test_path.write_text(
              '''from __future__ import annotations\n\nimport math\nfrom unittest.mock import patch\n\nfrom b3_strategy_lab.candles import Candle\nfrom scripts import research_portfolio_allocation_core as core\n\n\ndef _candle(day: str, *, open_price: float, close_price: float) -> Candle:\n    high = max(open_price, close_price)\n    low = min(open_price, close_price)\n    return Candle(\n        date=day,\n        ticker="AAA",\n        source_symbol="AAA",\n        open=open_price,\n        high=high,\n        low=low,\n        close=close_price,\n        adj_close=close_price,\n        volume=1_000,\n        raw_open=open_price,\n        raw_high=high,\n        raw_low=low,\n        raw_close=close_price,\n        adjustment_factor=1.0,\n    )\n\n\ndef test_final_liquidation_uses_close_slippage_and_costs() -> None:\n    candle = _candle("2026-01-05", open_price=100.0, close_price=100.0)\n    shares = {"AAA": 10.0}\n\n    trades, turnover, cash = core._liquidate_at_close(\n        candle.date,\n        ["AAA"],\n        {"AAA": candle},\n        shares,\n        0.0,\n        0.001,\n        0.01,\n    )\n\n    assert trades == 1\n    assert shares["AAA"] == 0.0\n    assert math.isclose(cash, 10 * 99.0 * 0.999, rel_tol=0, abs_tol=1e-12)\n    assert math.isclose(turnover, 990.0 / 1000.0, rel_tol=0, abs_tol=1e-12)\n\n\ndef test_average_year_input_excludes_partial_calendar_years() -> None:\n    dates = [\n        "2018-01-02",\n        "2018-12-28",\n        "2019-01-02",\n        "2019-12-30",\n        "2020-01-02",\n        "2020-08-31",\n    ]\n    equities = [100.0, 110.0, 110.0, 121.0, 121.0, 133.1]\n\n    yearly = core._yearly_returns(equities, dates, 100.0)\n    completed = core._full_calendar_year_returns(equities, dates, 100.0)\n\n    assert set(yearly) == {2018, 2019, 2020}\n    assert set(completed) == {2018, 2019}\n    assert all(math.isclose(value, 0.1, rel_tol=0, abs_tol=1e-12) for value in completed.values())\n\n\ndef test_run_portfolio_finishes_in_cash_after_last_close() -> None:\n    candles = [\n        _candle("2026-01-05", open_price=100.0, close_price=100.0),\n        _candle("2026-01-06", open_price=100.0, close_price=105.0),\n        _candle("2026-01-07", open_price=105.0, close_price=110.0),\n    ]\n\n    class Data:\n        tickers = ["AAA"]\n        dates = [candle.date for candle in candles]\n        by_date = {"AAA": {candle.date: candle for candle in candles}}\n        index_by_date = {"AAA": {candle.date: i for i, candle in enumerate(candles)}}\n        signal_prices = {"AAA": [candle.close for candle in candles]}\n        raw_returns = {"AAA": [0.0, 0.05, 110.0 / 105.0 - 1.0]}\n        candidate_profile_cache = {}\n\n    config = core.PortfolioConfig(name="test", rebalance="daily")\n    with patch.object(core, "_target_weights", return_value={"AAA": 1.0}):\n        summary, curve = core.run_portfolio(\n            Data(),\n            config,\n            initial_cash=1_000.0,\n            cost_bps=0.0,\n            slippage_bps=0.0,\n            lot_size=1,\n            collect_curve=True,\n        )\n\n    assert summary.trades == 2\n    assert curve[-1].positions == 0\n    assert curve[-1].selected == ""\n    assert math.isclose(curve[-1].cash, curve[-1].equity, rel_tol=0, abs_tol=1e-12)\n    assert math.isclose(summary.final_equity, curve[-1].cash, rel_tol=0, abs_tol=1e-12)\n''',
              encoding="utf-8",
          )
          PY

      - name: Preserve terminal-session curve semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path("scripts/research_portfolio_allocation_core.py")
          text = core.read_text(encoding="utf-8")
          old = '''                    positions=len(selected_for_curve),\n                    selected=";".join(selected_for_curve),\n'''
          new = '''                    positions=len(selected),\n                    selected=";".join(selected),\n'''
          if text.count(old) != 1:
              raise SystemExit("terminal curve replacement mismatch")
          core.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("tests/test_simple_backtest_fixes.py")
          text = test.read_text(encoding="utf-8")
          old = '''    assert curve[-1].positions == 0\n    assert curve[-1].selected == ""\n'''
          new = '''    # selected/positions describe the asset held during the final session;\n    # cash/equity already reflect the mandatory close liquidation.\n    assert curve[-1].positions == 1\n    assert curve[-1].selected == "AAA"\n'''
          if text.count(old) != 1:
              raise SystemExit("focused test replacement mismatch")
          test.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused tests
        run: python -m pytest -q tests/test_simple_backtest_fixes.py

      - name: Run full test suite
        run: python -m pytest -q

      - name: Commit fixes to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/simple-backtest-fixes.yml
          git add scripts/research_portfolio_allocation_core.py \
                  scripts/backtest_strategy_management_combinations.py \
                  scripts/audit_matrix_results.py \
                  tests/test_simple_backtest_fixes.py
          git commit -m "fix: liquidate final positions and correct annual average [skip ci]"
          git push origin HEAD:main
