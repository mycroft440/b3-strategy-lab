name: One-shot certified complex transition ranking fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-complex-transition-fix.yml"

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair temporary patch generator indentation
        run: |
          sed -i "s/'previous_sort_key:/'    previous_sort_key:/" scripts/_one_shot_complex_transition_patch.py
          sed -i "s/'invalid_rows_are_explicit =/'    invalid_rows_are_explicit =/" scripts/_one_shot_complex_transition_patch.py
          sed -i "s/'valid_rows_precede_invalid_rows =/'    valid_rows_precede_invalid_rows =/" scripts/_one_shot_complex_transition_patch.py
          sed -i "s/'seen_invalid =/'    seen_invalid =/" scripts/_one_shot_complex_transition_patch.py
          sed -i "s/'valid_row_count =/'    valid_row_count =/" scripts/_one_shot_complex_transition_patch.py
          sed -i "s/'invalid_row_count =/'    invalid_row_count =/" scripts/_one_shot_complex_transition_patch.py
      - name: Apply deterministic patch
        run: python scripts/_one_shot_complex_transition_patch.py
      - name: Compile and test
        run: |
          python -m py_compile scripts/research_portfolio_allocation.py scripts/backtest_strategy_management_combinations.py scripts/merge_matrix_shards.py scripts/audit_matrix_results.py
          python -m pip install -r requirements-test.txt
          python -m pytest -q tests/test_matrix_complex_transition_invalid.py
          python -m pytest -q
      - name: Commit tested fix and remove staging files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-complex-transition-fix.yml
          git rm -f scripts/_one_shot_complex_transition_patch.py
          git add scripts/research_portfolio_allocation.py scripts/backtest_strategy_management_combinations.py scripts/merge_matrix_shards.py scripts/audit_matrix_results.py tests/test_matrix_complex_transition_invalid.py
          git commit -m "fix: isolate certified complex transition matrix rows"
          git push origin HEAD:main
