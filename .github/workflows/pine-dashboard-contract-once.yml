name: Pine dashboard contract once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pine-dashboard-contract-once.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Pine dashboard frozen contract
        run: python -m unittest tests.test_pine_parabolic_dashboard_contract -v
      - name: Self-remove after success
        run: |
          rm .github/workflows/pine-dashboard-contract-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/pine-dashboard-contract-once.yml
          git commit -m "Validate Pine v5 dashboard contract"
          git pull --rebase origin main
          git push origin HEAD:main
