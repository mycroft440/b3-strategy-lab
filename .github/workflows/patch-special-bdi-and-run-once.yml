name: Patch special-situation BDI handling and rerun once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-special-bdi-and-run-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  patch-test-commit-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Corrigir leitura de BDI de ações em situação especial
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          cotahist = "b3_strategy_lab/cotahist.py"
          replace_once(
              cotahist,
              'UNVERIFIED_ACTION_STATUS = "unverified"\n',
              'UNVERIFIED_ACTION_STATUS = "unverified"\n'
              '# B3 CODBDI equity status codes for standard-lot shares. Codes 05/06/07/08/09/11\n'
              '# are still company equities, but indicate special regulatory/restructuring status.\n'
              '# Excluding them silently truncates a ticker exactly when its BDI status changes.\n'
              'STANDARD_EQUITY_BDI_CODES = ("02", "05", "06", "07", "08", "09", "11")\n',
          )
          replace_once(
              cotahist,
              '    bdi_codes: Iterable[str] = ("02",),\n',
              '    bdi_codes: Iterable[str] = STANDARD_EQUITY_BDI_CODES,\n',
          )
          replace_once(
              cotahist,
              '            "B3 COTAHIST QUATOT/TOTNEG/VOLTOT; market 010 BDI 02 plus market "\n'
              '            "020 BDI 96 when fractional records are available"\n',
              '            "B3 COTAHIST QUATOT/TOTNEG/VOLTOT; market 010 equity BDI "\n'
              '            "02/05/06/07/08/09/11 plus market 020 BDI 96 when fractional "\n'
              '            "records are available"\n',
          )
          replace_once(
              cotahist,
              '            else "B3 COTAHIST QUATOT/TOTNEG/VOLTOT; standard market 010 BDI 02 only"\n',
              '            else "B3 COTAHIST QUATOT/TOTNEG/VOLTOT; standard market 010 equity "\n'
              '            "BDI 02/05/06/07/08/09/11"\n',
          )

          pit = "b3_strategy_lab/point_in_time.py"
          replace_once(
              pit,
              'from .cotahist import parse_cotahist_lines\n',
              'from .cotahist import STANDARD_EQUITY_BDI_CODES, parse_cotahist_lines\n',
          )
          replace_once(pit, 'STANDARD_BDI = "02"\n', 'STANDARD_BDI_CODES = STANDARD_EQUITY_BDI_CODES\n')
          replace_once(
              pit,
              'def _mask_non_company_equity_records(\n    lines,\n    *,\n    bdi_code: str,\n    market_type: str,\n):\n',
              'def _mask_non_company_equity_records(\n    lines,\n    *,\n    bdi_codes: tuple[str, ...],\n    market_type: str,\n):\n',
          )
          replace_once(
              pit,
              '        if line[10:12] != bdi_code or line[24:27] != market_type:\n',
              '        if line[10:12] not in bdi_codes or line[24:27] != market_type:\n',
          )
          replace_once(
              pit,
              'def _read_company_equity_cotahist(\n    path: Path | str,\n    *,\n    bdi_code: str,\n    market_type: str,\n) -> list:\n',
              'def _read_company_equity_cotahist(\n    path: Path | str,\n    *,\n    bdi_codes: tuple[str, ...],\n    market_type: str,\n) -> list:\n',
          )
          replace_once(pit, '        "bdi_codes": (bdi_code,),\n', '        "bdi_codes": bdi_codes,\n')
          replace_once(pit, '                bdi_code=bdi_code,\n', '                bdi_codes=bdi_codes,\n')
          replace_once(pit, '        bdi_code=STANDARD_BDI,\n', '        bdi_codes=STANDARD_BDI_CODES,\n')
          replace_once(pit, '        bdi_code=FRACTIONAL_BDI,\n', '        bdi_codes=(FRACTIONAL_BDI,),\n')
          replace_once(
              pit,
              '    """Read only standard-lot ON/PN company shares used by the certified universe."""\n',
              '    """Read standard-lot ON/PN shares across all B3 equity status BDI codes."""\n',
          )

          test_cotahist = "tests/test_cotahist.py"
          replace_once(
              test_cotahist,
              '    quote_date: str = "20240102",\n',
              '    quote_date: str = "20240102",\n    bdi_code: str = "02",\n',
          )
          replace_once(test_cotahist, '    put(10, 12, "02")\n', '    put(10, 12, bdi_code)\n')
          replace_once(
              test_cotahist,
              'class CotahistParsingTests(unittest.TestCase):\n',
              '''class CotahistParsingTests(unittest.TestCase):\n    def test_default_parser_keeps_equity_special_situation_bdi_codes(self) -> None:\n        codes = ("02", "05", "06", "07", "08", "09", "11")\n        details = [\n            cotahist_line(\n                quote_date=f"202401{index + 2:02d}",\n                bdi_code=code,\n            )\n            for index, code in enumerate(codes)\n        ]\n        details.append(cotahist_line(quote_date="20240109", bdi_code="10"))\n\n        quotes = parse_cotahist_lines(\n            cotahist_envelope(details),\n            require_envelope=True,\n        )\n\n        self.assertEqual([item.bdi_code for item in quotes], list(codes))\n\n''',
          )

          test_pit = "tests/test_point_in_time_cotahist.py"
          replace_once(
              test_pit,
              '    def test_unknown_positive_company_equity_bad_ohlc_still_fails_closed(self) -> None:\n',
              '''    def test_standard_reader_keeps_recovery_extrajudicial_equity(self) -> None:\n        recovered = cotahist_line(\n            ticker="BRKM5",\n            specification="PNA N1",\n            bdi_code="07",\n            market_type="010",\n            open_=4.56,\n            high=4.70,\n            low=4.10,\n            close=4.11,\n        )\n\n        quotes = read_standard_company_equity_cotahist(\n            self._write(envelope([recovered]))\n        )\n\n        self.assertEqual(len(quotes), 1)\n        self.assertEqual(quotes[0].ticker, "BRKM5")\n        self.assertEqual(quotes[0].bdi_code, "07")\n\n    def test_unknown_positive_company_equity_bad_ohlc_still_fails_closed(self) -> None:\n''',
          )

          # Remove temporary one-shot workflow files from the permanent main branch.
          Path(".github/workflows/bootstrap-realistic-snapshot-once.yml").unlink(missing_ok=True)
          Path(".github/workflows/patch-special-bdi-and-run-once.yml").unlink(missing_ok=True)
          PY

      - name: Compilar e executar suíte completa
        run: |
          python -m py_compile b3_strategy_lab/cotahist.py b3_strategy_lab/point_in_time.py
          python -m unittest discover -s tests -v

      - name: Subir correção diretamente na main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(data): retain special-situation B3 equity quotes [skip ci]"
          git push origin HEAD:main

      - name: Executar backtest completo com atualização oficial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run full-matrix-backtest-hardened.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f refresh_data=true
