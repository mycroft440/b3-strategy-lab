name: Finalize survivorship-safe matrix

on:
  push:
    branches:
      - fix/survivorship-safe-research-matrix-20260905
    paths:
      - .github/workflows/survivorship-safe-final-runner.yml

permissions:
  contents: write

jobs:
  test-and-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/survivorship-safe-research-matrix-20260905
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reapply reviewed PIT patch and compatibility layer
        shell: bash
        run: |
          set -euo pipefail
          git show 2c9e467021c2883f98af6bd13101fc8fa3fbf34f:.github/workflows/survivorship-safe-research-matrix-patch.yml > /tmp/base.yml
          git show 7aa894e1bbad592331b69480c8567433b66fde43:.github/workflows/survivorship-safe-patch-runner.yml > /tmp/compat.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def blocks(path: str) -> list[str]:
              lines = Path(path).read_text(encoding='utf-8').splitlines()
              result = []
              current = None
              for line in lines:
                  if line.strip() == "python - <<'PY'":
                      current = []
                      continue
                  if current is not None and line.strip() == 'PY':
                      result.append(textwrap.dedent('\n'.join(current)))
                      current = None
                      continue
                  if current is not None:
                      current.append(line)
              return result

          base = blocks('/tmp/base.yml')
          compat = blocks('/tmp/compat.yml')
          if len(base) != 1 or len(compat) != 2:
              raise SystemExit(f'unexpected patch blocks: base={len(base)} compat={len(compat)}')
          exec(compile(base[0], '<pit-base>', 'exec'), {})
          # compat[0] is only the helper that re-executes the base patch.
          exec(compile(compat[1], '<pit-compat>', 'exec'), {})
          PY

      - name: Add explicit storage roots and close legacy test backdoors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          matrix = 'scripts/backtest_strategy_management_combinations.py'
          replace_once(
              matrix,
              '''    parser.add_argument(\n        "--universe-manifest",\n        type=Path,\n        default=DEFAULT_UNIVERSE_MANIFEST,\n        help="Manifesto survivorship-safe point-in-time com snapshots historicos.",\n    )\n    parser.add_argument("--strategies", nargs="+", default=portfolio_strategies())\n''',
              '''    parser.add_argument(\n        "--universe-manifest",\n        type=Path,\n        default=DEFAULT_UNIVERSE_MANIFEST,\n        help="Manifesto survivorship-safe point-in-time com snapshots historicos.",\n    )\n    parser.add_argument("--data-dir", type=Path, default=PIT_DATA_DIR)\n    parser.add_argument("--actions-dir", type=Path, default=PIT_ACTIONS_DIR)\n    parser.add_argument("--manifests-dir", type=Path, default=PIT_MANIFESTS_DIR)\n    parser.add_argument("--split-evidence", type=Path, default=PIT_SPLIT_EVIDENCE)\n    parser.add_argument("--strategies", nargs="+", default=portfolio_strategies())\n''',
          )
          replace_once(
              matrix,
              '''        data_dir=PIT_DATA_DIR,\n        actions_dir=PIT_ACTIONS_DIR,\n        manifests_dir=PIT_MANIFESTS_DIR,\n        split_evidence_path=PIT_SPLIT_EVIDENCE,\n''',
              '''        data_dir=args.data_dir,\n        actions_dir=args.actions_dir,\n        manifests_dir=args.manifests_dir,\n        split_evidence_path=args.split_evidence,\n''',
          )
          replace_once(
              matrix,
              '''        "market_data_paths": {\n            "data_dir": str(PIT_DATA_DIR),\n            "actions_dir": str(PIT_ACTIONS_DIR),\n            "manifests_dir": str(PIT_MANIFESTS_DIR),\n            "split_evidence": str(PIT_SPLIT_EVIDENCE),\n        },\n''',
              '''        "market_data_paths": {\n            "data_dir": str(args.data_dir),\n            "actions_dir": str(args.actions_dir),\n            "manifests_dir": str(args.manifests_dir),\n            "split_evidence": str(args.split_evidence),\n        },\n''',
          )

          # A user-picked retrospective subset is intentionally NOT accepted by
          # the strict historical matrix. Keep the legacy panel test honest.
          test = 'tests/test_combination_control_panel.py'
          replace_once(
              test,
              '''    def test_user_subset_is_a_valid_universe_manifest(self) -> None:\n        payload = _selected_payload(["PETR4", "VALE3"])\n        with tempfile.TemporaryDirectory() as tmp:\n            path = Path(tmp) / "subset.json"\n            path.write_text(json.dumps(payload), encoding="utf-8")\n            loaded = _load_universe(path)\n        self.assertEqual(loaded["tickers"], ["PETR4", "VALE3"])\n''',
              '''    def test_user_subset_is_rejected_by_strict_historical_matrix(self) -> None:\n        payload = _selected_payload(["PETR4", "VALE3"])\n        with tempfile.TemporaryDirectory() as tmp:\n            path = Path(tmp) / "subset.json"\n            path.write_text(json.dumps(payload), encoding="utf-8")\n            with self.assertRaisesRegex(ValueError, "PIT|point_in_time|survivorship"):\n                _load_universe(path)\n''',
          )

          # Determinism is tested with an explicit synthetic PIT fixture. This is
          # test-only and never provides a production fallback to the old universe.
          test = 'tests/test_execution_hardening.py'
          old = '''    def test_serial_and_parallel_small_matrix_are_identical(self) -> None:\n        with tempfile.TemporaryDirectory() as directory:\n            serial = Path(directory) / "serial.csv.gz"\n            parallel = Path(directory) / "parallel.csv.gz"\n            common = [\n                sys.executable,\n                "scripts/backtest_strategy_management_combinations.py",\n                "--strategies", "buy_and_hold", "gap_momentum",\n                "--config-set", "base",\n                "--start", "2024-01-02",\n                "--end", "2024-06-28",\n                "--initial-cash", "1000",\n                "--lot-size", "1",\n                "--top", "3",\n            ]\n'''
          new = '''    def test_serial_and_parallel_small_matrix_are_identical(self) -> None:\n        with tempfile.TemporaryDirectory() as directory:\n            directory_path = Path(directory)\n            serial = directory_path / "serial.csv.gz"\n            parallel = directory_path / "parallel.csv.gz"\n            snapshot = directory_path / "pit_weekly.csv"\n            snapshot.write_text(\n                "effective_date,ticker,rank\\n"\n                "2024-01-02,PETR4,1\\n"\n                "2024-01-02,VALE3,2\\n",\n                encoding="utf-8",\n            )\n            pit_manifest = directory_path / "pit_universe.json"\n            pit_manifest.write_text(\n                json.dumps(\n                    {\n                        "schema_version": 8,\n                        "id": "parallel-determinism-pit-fixture",\n                        "selection_mode": "test_only_point_in_time_fixture",\n                        "selected_as_of": "2024-01-02",\n                        "selection_end": "2024-06-28",\n                        "warmup_start": "2017-01-01",\n                        "survivorship_safe": True,\n                        "point_in_time": True,\n                        "snapshot_file": str(snapshot),\n                        "bias_disclosure": "Synthetic unit-test fixture; not a research universe.",\n                        "selection_rules": {\n                            "weekly_candidates": 2,\n                            "future_continuity_filter": False,\n                            "future_return_filter": False,\n                        },\n                        "tickers": ["PETR4", "VALE3"],\n                    }\n                ),\n                encoding="utf-8",\n            )\n            common = [\n                sys.executable,\n                "scripts/backtest_strategy_management_combinations.py",\n                "--universe-manifest", str(pit_manifest),\n                "--data-dir", "data/candles",\n                "--actions-dir", "data/corporate_actions",\n                "--manifests-dir", "data/manifests",\n                "--split-evidence", "data/corporate_actions/split_evidence.json",\n                "--strategies", "buy_and_hold", "gap_momentum",\n                "--config-set", "base",\n                "--start", "2024-01-02",\n                "--end", "2024-06-28",\n                "--initial-cash", "1000",\n                "--lot-size", "1",\n                "--top", "3",\n            ]\n'''
          replace_once(test, old, new)
          PY

      - name: Compile changed critical modules
        run: |
          python -m py_compile \
            scripts/research_portfolio_allocation_core.py \
            scripts/backtest_strategy_management_combinations.py \
            scripts/audit_matrix_results.py \
            scripts/merge_matrix_shards.py

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run focused PIT tests
        run: |
          python -m pytest -q \
            tests/test_survivorship_safe_research_matrix.py \
            tests/test_combination_control_panel.py \
            tests/test_execution_hardening.py::MatrixParallelDeterminismTests::test_serial_and_parallel_small_matrix_are_identical \
            tests/test_portfolio_allocation.py

      - name: Run full test suite
        run: python -m pytest -q

      - name: Squash tested changes and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rm .github/workflows/survivorship-safe-research-matrix-patch.yml \
                 .github/workflows/survivorship-safe-patch-runner.yml \
                 .github/workflows/survivorship-safe-final-runner.yml
          git add scripts/research_portfolio_allocation_core.py \
                  scripts/backtest_strategy_management_combinations.py \
                  scripts/audit_matrix_results.py \
                  scripts/merge_matrix_shards.py \
                  .github/workflows/full-matrix-backtest-hardened.yml \
                  tests/test_survivorship_safe_research_matrix.py \
                  tests/test_portfolio_allocation.py \
                  tests/test_combination_control_panel.py \
                  tests/test_execution_hardening.py
          git reset --soft origin/main
          git commit -m "fix: use survivorship-safe point-in-time research universe [skip ci]"
          git push origin HEAD:main
