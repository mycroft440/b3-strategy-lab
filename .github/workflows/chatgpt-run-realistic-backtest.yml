name: ChatGPT realistic backtest run

on:
  push:
    branches:
      - chatgpt/run-realistic-backtest-20260819
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/chatgpt-run-realistic-backtest.yml"
      - "b3_strategy_lab/point_in_time.py"
      - "scripts/build_point_in_time_universe.py"
      - "tests/test_point_in_time_cotahist.py"

permissions:
  contents: read

jobs:
  diagnose-ealt3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run point-in-time parser regression tests
        run: |
          python -m unittest \
            tests.test_point_in_time_cotahist \
            tests.test_realistic_accounting \
            tests.test_cash_distributions -v
      - name: Inspect official EALT3 COTAHIST records around 2020-06-08
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          from b3_strategy_lab.cotahist import download_cotahist

          archive_path = download_cotahist(2020, Path('.cache/cotahist'), refresh=True)
          with zipfile.ZipFile(archive_path) as archive:
              members = [name for name in archive.namelist() if not name.endswith('/')]
              if len(members) != 1:
                  raise RuntimeError(f'unexpected COTAHIST members: {members}')
              matches = []
              with archive.open(members[0]) as fh:
                  for line_number, raw in enumerate(fh, start=1):
                      line = raw.decode('latin-1').rstrip('\r\n')
                      if len(line) < 245 or line[:2] != '01':
                          continue
                      ticker = line[12:24].strip().upper()
                      day = line[2:10]
                      if ticker == 'EALT3' and '20200601' <= day <= '20200615':
                          factor_text = line[210:217]
                          factor = int(factor_text) if factor_text.strip() else 1
                          factor = factor if factor > 0 else 1
                          def price(start, end):
                              return int(line[start:end]) / 100 / factor
                          record = {
                              'line': line_number,
                              'date': day,
                              'bdi': line[10:12],
                              'ticker': ticker,
                              'market': line[24:27],
                              'issuer': line[27:39].strip(),
                              'spec': line[39:49].strip(),
                              'open': price(56,69),
                              'high': price(69,82),
                              'low': price(82,95),
                              'avg': price(95,108),
                              'close': price(108,121),
                              'quotation_factor': factor,
                              'trades_raw': line[147:152],
                              'quantity_raw': line[152:170],
                              'financial_volume_raw': line[170:188],
                              'isin': line[230:242].strip(),
                              'distribution_number': line[242:245],
                          }
                          matches.append((record, line))
              if not matches:
                  raise RuntimeError('No EALT3 records found in requested window')
              for record, raw_line in matches:
                  print('EALT3_RECORD', record)
                  if record['date'] == '20200608':
                      print('EALT3_20200608_RAW_LINE', raw_line)
          PY
